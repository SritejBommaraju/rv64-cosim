# CI testlist: same tests as testlist.yaml, sized for a 4-vCPU runner and a
# ~25 minute budget. pygen costs ~0.15 s per instruction on stream-heavy tests,
# so riscv-dv programs are kept short and the hazard generator (milliseconds per
# program) carries the volume. cosim.py regress --budget interleaves tests
# round-robin and stops launching new runs at the deadline.

- test: riscv_arithmetic_basic_test
  gen_opts: >
    +instr_cnt=3000
    +num_of_sub_program=0
    +directed_instr_0=riscv_int_numeric_corner_stream,4
    +no_fence=1
    +no_data_page=1
    +no_branch_jump=1
  iterations: 20

- test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=800
    +num_of_sub_program=3
    +directed_instr_0=riscv_load_store_rand_instr_stream,4
    +directed_instr_1=riscv_loop_instr,4
    +directed_instr_2=riscv_load_store_hazard_instr_stream,4
    +directed_instr_3=riscv_jal_instr,4
  iterations: 20

- test: riscv_jump_stress_test
  gen_opts: >
    +instr_cnt=800
    +num_of_sub_program=3
    +directed_instr_1=riscv_jal_instr,20
  iterations: 20

- test: riscv_loop_test
  gen_opts: >
    +instr_cnt=800
    +num_of_sub_program=3
    +directed_instr_1=riscv_loop_instr,20
  iterations: 20

- test: riscv_mem_stress_test
  gen_opts: >
    +instr_cnt=800
    +num_of_sub_program=3
    +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40
  iterations: 20

- test: riscv_unaligned_load_store_test
  gen_opts: >
    +instr_cnt=800
    +num_of_sub_program=3
    +directed_instr_0=riscv_load_store_rand_instr_stream,20
    +directed_instr_1=riscv_load_store_hazard_instr_stream,20
    +enable_unaligned_load_store=1
  iterations: 20

- test: ooo_hazard_test
  generator: hazard
  gen_opts: --scenarios 400 --m-ext
  iterations: 200

- test: ooo_hazard_tight_test
  generator: hazard
  gen_opts: --scenarios 400 --pool 3 --window 16 --m-ext
  iterations: 200

- test: ooo_hazard_aligned_test
  generator: hazard
  gen_opts: --scenarios 400 --window 256 --aligned-only --m-ext
  iterations: 100
