# riscv-dv (pygen) tests for rv64-ooo-core.
#
# num_of_sub_program is 0 everywhere: pygen's call-stack path is unfinished
# upstream (riscv_callstack_gen raises, and riscv_instr_sequence.insert_jump_instr
# / riscv_jump_instr are TODO stubs), so sub-programs could never be called.
# riscv_loop_instr is not used either: pygen's version emits sret, `none`
# immediates and x0 loop counters. hazard_gen.py covers counted loops.
# Options use riscv-dv's +opt=value
# spelling; cosim.py adds BASE_GEN_OPTS (bare M-mode, no compressed, no
# ecall/ebreak/wfi, no random CSR ops) to every test.

- test: riscv_arithmetic_basic_test
  description: Arithmetic only, integer corner values, no load/store/branch
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=0
    +directed_instr_0=riscv_int_numeric_corner_stream,4
    +no_fence=1
    +no_data_page=1
    +no_branch_jump=1
  iterations: 4

- test: riscv_rand_instr_test
  description: Random instruction stress with jumps and load/store streams
  gen_opts: >
    +instr_cnt=10000
    +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,4
    +directed_instr_1=riscv_load_store_hazard_instr_stream,4
    +directed_instr_2=riscv_jal_instr,4
  iterations: 6

- test: riscv_jump_stress_test
  description: Back-to-back jumps
  gen_opts: >
    +instr_cnt=5000
    +num_of_sub_program=0
    +directed_instr_1=riscv_jal_instr,20
  iterations: 3



- test: riscv_mem_stress_test
  description: Dense load/store traffic (riscv-dv's mmu_stress_test without paging)
  gen_opts: >
    +instr_cnt=5000
    +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40
  iterations: 4

- test: riscv_unaligned_load_store_test
  description: Unaligned loads/stores (the core handles them in hardware)
  gen_opts: >
    +instr_cnt=6000
    +num_of_sub_program=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,20
    +directed_instr_1=riscv_load_store_hazard_instr_stream,20
    +enable_unaligned_load_store=1
  iterations: 3

# ---- custom OoO hazard programs (scripts/hazard_gen.py) ----
- test: ooo_hazard_test
  description: Weighted mix of all hazard scenarios, 6-register pool, 64-byte window
  generator: hazard
  gen_opts: --scenarios 400 --m-ext
  iterations: 8

- test: ooo_hazard_tight_test
  description: 3-register pool and 16-byte window for maximum aliasing
  generator: hazard
  gen_opts: --scenarios 400 --pool 3 --window 16 --m-ext
  iterations: 6

- test: ooo_hazard_aligned_test
  description: Naturally aligned accesses only, wider window
  generator: hazard
  gen_opts: --scenarios 400 --window 256 --aligned-only --m-ext
  iterations: 4
